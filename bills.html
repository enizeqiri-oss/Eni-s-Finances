<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bills — Atelier</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Geist:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/atelier.css">
</head>
<body data-page="bills">
<div class="app">

<aside class="sidebar">
  <div class="brand">
    <span class="brand-name">Atelier</span>
    <span class="brand-ver">v 4.2</span>
  </div>
  <nav class="nav">
    <a class="nav-item" href="index.html">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/></svg>Overview
    </a>
    <a class="nav-item" href="income.html">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 11h18"/></svg>Income
    </a>
    <a class="nav-item active" href="bills.html">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Bills
    </a>
    <a class="nav-item" href="upload.html">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V5"/><path d="M7 10l5-5 5 5"/><path d="M5 20h14"/></svg>Upload
    </a>
    <a class="nav-item" href="summary.html">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Summary
    </a>
  </nav>
  <div class="spacer"></div>
  <div class="side-card">
    <span class="label">Statement period</span>
    <div class="v" data-month>—</div>
  </div>
  <a class="link" href="mobile.html" style="padding: 4px 8px; display: block;">Mobile preview &rarr;</a>
  <a class="link" href="#" data-action="reset" style="padding: 4px 8px; display: block; color: var(--ink-3);">Reset all data</a>
  <div class="user">
    <div class="avatar"><span data-bind="profile.firstName">L</span></div>
    <div><div class="who"><span data-bind="profile.firstName">You</span></div><div class="where" data-bind="profile.kanton">Kanton</div></div>
  </div>
</aside>

<main class="main">

  <header class="topbar">
    <div class="left">
      <span class="eyebrow"><span data-bind="bills.length">0</span> active &middot; <span data-month></span></span>
      <h1 class="display">Monthly <em>commitments</em></h1>
    </div>
    <div class="top-actions">
      <button class="icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.3-4.3"/></svg>
      </button>
      <button class="btn-primary" data-action="add-bill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        New bill
      </button>
    </div>
  </header>

  <section class="hero" style="grid-template-columns: 1fr 1fr 1fr 1fr; gap: 28px; margin-bottom: 18px;">
    <div class="col">
      <span class="label">Total fixed &middot; monthly</span>
      <div class="num-l"><span data-bind="totalFixed" data-fmt="num">0</span></div>
      <div class="sub-line italic-s muted"><span data-bind-html="totalFixed">0</span></div>
    </div>
    <div class="col">
      <span class="label"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sage);vertical-align:1px;margin-right:6px;"></span>Paid &middot; <span data-bind="paidCount">0</span></span>
      <div class="num-l"><span data-bind="paidTotal" data-fmt="num">0</span></div>
    </div>
    <div class="col">
      <span class="label"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);vertical-align:1px;margin-right:6px;"></span>Upcoming &middot; <span data-bind="upcomingCount">0</span></span>
      <div class="num-l"><span data-bind="upcomingTotal" data-fmt="num">0</span></div>
    </div>
    <div class="col">
      <span class="label"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);vertical-align:1px;margin-right:6px;"></span>Annual</span>
      <div class="num-l"><span data-bind="annual" data-fmt="num">0</span></div>
    </div>
  </section>

  <div class="row" style="justify-content: space-between; align-items: center; margin: 18px 0 14px;">
    <div class="chips" style="margin: 0;">
      <button class="chip-btn active" data-filter="all">All</button>
      <button class="chip-btn" data-filter="Housing">Housing</button>
      <button class="chip-btn" data-filter="Insurance">Insurance</button>
      <button class="chip-btn" data-filter="Utilities">Utilities</button>
      <button class="chip-btn" data-filter="Transport">Transport</button>
      <button class="chip-btn" data-filter="Health">Health</button>
      <button class="chip-btn" data-filter="Subs">Subs</button>
    </div>
    <span class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.3-4.3"/></svg>
      Click a status to toggle paid &middot; × to remove
    </span>
  </div>

  <div class="card" style="padding: 18px 24px;">
    <table class="table">
      <thead>
        <tr>
          <th>Vendor</th>
          <th>Category</th>
          <th>Due</th>
          <th>Status</th>
          <th class="r">Amount</th>
          <th></th>
        </tr>
      </thead>
      <tbody data-list="bills"></tbody>
    </table>
  </div>

</main>
</div>

<script src="assets/state.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
